<svg width="100%" height="4" viewBox="0 0 900 4" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      <animate attributeName="x1" values="-20%;100%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;200%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1" width="900" height="2" rx="1" fill="url(#divGrad)"/>
</svg>
