<svg width="100%" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shaik Khaja — Curious builder, exploring AI, backend engineering and distributed systems">
  <defs>
    <!-- Animated gradient for the name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Underline gradient -->
    <linearGradient id="underlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      <animate attributeName="x1" values="-30%;70%;-30%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="30%;130%;30%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <style>
      /* ---------- Dark theme (default) ---------- */
      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 46px;
        font-weight: 700;
        fill: url(#nameGrad);
        filter: url(#glow);
      }
      .tagline {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 18px;
        fill: #8b949e;
      }
      .cursor {
        fill: #3fb950;
      }
      .underline-bar {
        fill: url(#underlineGrad);
      }

      /* ---------- Light theme ---------- */
      @media (prefers-color-scheme: light) {
        .tagline { fill: #656d76; }
        .cursor  { fill: #1a7f37; }
      }
    </style>
  </defs>

  <!-- Name with animated gradient -->
  <text x="50%" y="60" text-anchor="middle" class="name">
    Shaik Khaja
    <!-- Fade-in on load -->
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <!-- Animated underline accent -->
  <rect x="310" y="72" width="280" height="2" rx="1" class="underline-bar">
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Blinking cursor -->
  <rect x="593" y="36" width="3" height="30" rx="1.5" class="cursor">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Rotating tagline via SMIL fade-in/out — fully self-contained -->
  <g text-anchor="middle" class="tagline" transform="translate(450,106)">
    <text opacity="0">
      Curious builder
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" keyTimes="0;0.02;0.22;0.25;0.5;0.75;0.98;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text opacity="0">
      Exploring AI &amp; backend systems
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.5;0.73;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text opacity="0">
      Learning, one build at a time
      <animate attributeName="opacity" values="1;0;0;0;0;0;0;1" keyTimes="0;0.02;0.5;0.73;0.75;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom separator line -->
  <rect x="0" y="138" width="900" height="1" rx="0.5" fill="#30363d" opacity="0.5"/>
</svg>
