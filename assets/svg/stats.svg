<svg width="420" height="170" viewBox="0 0 420 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Dark theme (default) */
    .card-bg   { fill: #161b22; }
    .card-border { stroke: #30363d; }
    .title     { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label     { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .value     { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .accent    { fill: #3fb950; }
    .accent-blue { fill: #58a6ff; }
    .accent-purple { fill: #bc8cff; }
    .icon-fill { fill: #8b949e; }

    /* Light theme */
    @media (prefers-color-scheme: light) {
      .card-bg   { fill: #f6f8fa; }
      .card-border { stroke: #d0d7de; }
      .title     { fill: #1f2328; }
      .label     { fill: #656d76; }
      .value     { fill: #1f2328; }
      .accent    { fill: #1a7f37; }
      .accent-blue { fill: #0969da; }
      .accent-purple { fill: #8250df; }
      .icon-fill { fill: #656d76; }
    }
  </style>

