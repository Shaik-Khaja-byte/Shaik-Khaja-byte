<svg width="450" height="150" viewBox="0 0 450 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Dark theme (default) */
    .card-bg   { fill: #161b22; }
    .card-border { stroke: #30363d; }
    .title     { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .label     { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .value     { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .accent    { fill: #3fb950; }
    .accent-blue { fill: #58a6ff; }
    .accent-purple { fill: #bc8cff; }
    .icon-fill { fill: #8b949e; }

    /* Light theme */
    @media (prefers-color-scheme: light) {
      .card-bg   { fill: #f6f8fa; }
      .card-border { stroke: #d0d7de; }
      .title     { fill: #1f2328; }
      .label     { fill: #656d76; }
      .value     { fill: #1f2328; }
      .accent    { fill: #1a7f37; }
      .accent-blue { fill: #0969da; }
      .accent-purple { fill: #8250df; }
      .icon-fill { fill: #656d76; }
    }
  </style>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="449" height="149" rx="12" class="card-bg card-border" stroke-width="1" fill="none"/>
  <rect x="1" y="1" width="448" height="148" rx="11.5" class="card-bg"/>
  <rect x="0.5" y="0.5" width="449" height="149" rx="12" fill="none" class="card-border" stroke-width="1"/>

  <!-- Title row -->
  <g transform="translate(20, 24)">
    <svg x="0" y="-6" width="16" height="16" viewBox="0 0 16 16"><path d="M7.998.002C7.998.002 5.248 3.752 5.248 6.002a2.75 2.75 0 1 0 5.5 0C10.748 3.752 7.998.002 7.998.002Z" class="icon-fill"/></svg>
    <text x="22" y="4" class="title">Contribution Streak</text>
  </g>

  <!-- Body -->
  
  <!-- Current streak -->
  <g transform="translate(75, 52)">
    <text x="0" y="30" class="value accent" text-anchor="middle" style="font-size: 28px; font-weight: 700;">20</text>
    <text x="0" y="48" class="label" text-anchor="middle">Current Streak</text>
    <text x="0" y="64" class="label" text-anchor="middle" style="font-size: 10px;">days</text>
  </g>

  <!-- Separator -->
  <line x1="150" y1="48" x2="150" y2="124" class="card-border" stroke-width="1" opacity="0.3"/>

  <!-- Longest streak -->
  <g transform="translate(225, 52)">
    <text x="0" y="30" class="value accent-blue" text-anchor="middle" style="font-size: 28px; font-weight: 700;">20</text>
    <text x="0" y="48" class="label" text-anchor="middle">Longest Streak</text>
    <text x="0" y="64" class="label" text-anchor="middle" style="font-size: 10px;">days</text>
  </g>

  <!-- Separator -->
  <line x1="300" y1="48" x2="300" y2="124" class="card-border" stroke-width="1" opacity="0.3"/>

  <!-- Total contributions -->
  <g transform="translate(375, 52)">
    <text x="0" y="30" class="value accent-purple" text-anchor="middle" style="font-size: 28px; font-weight: 700;">224</text>
    <text x="0" y="48" class="label" text-anchor="middle">Total Contributions</text>
    <text x="0" y="64" class="label" text-anchor="middle" style="font-size: 10px;">past year</text>
  </g>

</svg>